version: "3.8"

services:
  backend:
    build:
      context: ./cloud-backend
      dockerfile: Dockerfile
    container_name: canva_sinhala_backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-service-account.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./cloud-backend/credentials:/app/credentials:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./canva-app
      dockerfile: Dockerfile
    container_name: canva_sinhala_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
